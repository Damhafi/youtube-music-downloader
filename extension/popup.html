<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup">
        <!-- Header -->
        <div class="popup-header">
            <div class="popup-logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                    <path d="M9 18V5l12-2v13" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="6" cy="18" r="3" stroke="white" stroke-width="2"/>
                    <circle cx="18" cy="16" r="3" stroke="white" stroke-width="2"/>
                </svg>
            </div>
            <span class="popup-title">YT Music Downloader</span>
            <div class="server-status" id="serverStatus" title="Status do servidor">
                <div class="status-dot offline"></div>
            </div>
        </div>

        <!-- Current Song Info -->
        <div class="song-info" id="songInfo">
            <div class="song-title" id="songTitle">Detectando música...</div>
            <div class="song-meta" id="songMeta"></div>
        </div>

        <!-- Action Buttons -->
        <div class="popup-actions">
            <button class="popup-btn primary" id="btnDownloadCurrent">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Baixar Música Atual
            </button>
            <button class="popup-btn secondary" id="btnDownloadPlaylist">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
                    <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
                Baixar Playlist Inteira
            </button>
        </div>

        <!-- Folder -->
        <div class="folder-row" id="folderRow">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            <span id="currentFolder">Carregando...</span>
            <button class="folder-btn" id="btnChangeFolder">Alterar</button>
        </div>

        <!-- Status / Feedback -->
        <div class="popup-feedback" id="feedback" style="display:none"></div>

        <!-- Dashboard Link -->
        <a class="dashboard-link" href="http://127.0.0.1:5000" target="_blank" id="dashboardLink">
            Abrir Dashboard Completo ↗
        </a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
